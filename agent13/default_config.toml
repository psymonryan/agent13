# Self-update checks (GitHub releases)
# Set check_enabled = false to disable update notifications
[updates]
check_enabled = true
check_interval_hours = 24

# Auto-save location
# "central" = ~/.agent13/saves/<project>-YYYY-MM-DD.ctx
# "local" = ./.agent13/saves/<project>-YYYY-MM-DD.ctx (default)
[saves]
location = "local"

# Idle auto-save
# The daily auto-save is written on exit. With idle_seconds > 0 it is ALSO
# written once after this many seconds with nothing to do (the same file, so
# --continue picks up the freshest state). It fires once per idle period and
# only when the history changed - a long quiet stretch never rewrites an
# unchanged file. 0 = off.
# Equivalent CLI flag: --auto-save-idle N
[auto_save]
idle_seconds = 300

# The model's clock. The system prompt's "Session started" line is frozen for
# the whole session (a mid-session rewrite would invalidate the KV-cache
# prefix), so "now" reaches the model as an injected message instead: during a
# long turn, and at the start of a turn after the session sat idle. A day
# change always fires, whatever this is set to. 0 disables.
[datetime]
nudge_seconds = 3600

# Clipboard method
# "osc52" = terminal escape sequence (default, works over SSH)
#   Requires terminal support: Alacritty, Ghostty, Kitty, iTerm2,
#   Windows Terminal v1.18+. Does NOT work in tmux (without config),
#   GNU screen, or conhost/PowerShell.
# "system" = OS-level commands (pbcopy/xclip/wl-copy/clip.exe)
#   Works locally regardless of terminal, including tmux and screen.
#   Does NOT work over SSH (writes to remote clipboard).
# Change at runtime with: /clipboard osc52  or  /clipboard system
[clipboard]
method = "osc52"

# Terminal bell
# Ring the terminal bell when a turn completes (returns to idle).
# threshold = 0   → always ring (default)
# threshold = 30  → only ring if turn took longer than 30 seconds
# enabled = false → disable entirely
# command = "..."  → run an external command instead of the terminal bell
#   (e.g. a sound file). The first token must be an executable on PATH.
# Change at runtime with: /bell 30, /bell 0, /bell off, /bell
[bell]
enabled = true
threshold = 0
# command = "afplay /System/Library/Sounds/Glass.aiff"

# Auto-context threshold (tokens)
# When the context window (prompt_tokens) reaches this value mid-turn,
# the agent stops at the next safe point and takes the configured action
# (compact / report_and_compact / none).
# 180000 (180k) here suits ~260k-context models (e.g. Qwen 3.8) with a
# safety buffer. Must be an integer - no "k" suffix (180000, not "180k").
# Set to 0 to disable. Change at runtime with: /auto_context_threshold 150k
[auto_context]
threshold = 180000
# Action to take at the threshold. Change at runtime with:
# /auto_context_action <value>
#   compact            - full compact, then idle (chain>0: restart the turn)
#   report_and_compact - snapshot, run a wrap-up report turn, compact, then
#                        idle/restart
#   none               - leave the context untouched; pause so you can /model
#                        to a bigger-context model, /compact, or /journal all,
#                        then /resume.
# Equivalent CLI flag for report_and_compact: --report-and-compact
# action = "report_and_compact"
# How many times the agent may restart the turn after a compact within a single
# user turn. 0 = no restarts (the action fires once, then idle). Ignored when
# action = "none". Change at runtime with: /auto_context_chain N
# chain = 3
# Inject a TOPIC INDEX of the current-truth file instead of the whole file.
# Each topic is one line plus its first fact, with the file line number to read
# on demand; the ticket section is injected verbatim. Only applies to a record
# that has been migrated to "### TOPIC" headings - an unmigrated or
# half-migrated record is injected unchanged, so this is safe to leave on.
# Default false: the whole file is the known-good behaviour.
# truth_index = false

# Tool output bounding
# Tool results are the dominant unbounded source of context growth. A result
# whose text exceeds max_result_chars is spilled: the FULL text is written to
# a file under the OS temp dir (agent13_tool_output/), and the model receives
# the first 15,000 chars + a marker + the last 15,000 chars. The marker names
# the spill file - read the middle back with read_file (line numbers map 1:1
# onto read_file's offset/limit). A per-tool override can be declared on the
# tool function (@tool(max_result_chars=...)) and wins over this global cap.
# Set to 0 to disable bounding entirely.
[tools]
max_result_chars = 30000
# Mind maps (.itmz): refuse a write when the file was written this recently.
# The iThoughts app autosaves 10-20 s after an edit, so a fresh mtime means the
# user may be typing in the map - and the app silently discards their unsaved
# edit when the file changes underneath it. 0 disables the guard.
# The map tools are default-visible; to hide them entirely, add
#   disabled_tools = ["*map*"]
# to the global tool filter below.
mindmap_quiet_seconds = 20
# An .itmz whose style.xml is copied into maps made by create_map. Empty uses
# the bundled outline style. Point it at any map you like the look of.
# mindmap_style_template = "~/maps/journal.itmz"

# UI settings
# cursor_blink = false  → solid cursor, no periodic terminal output (default, tmux-friendly)
# cursor_blink = true   → blinking cursor (causes periodic output, triggers tmux activity)
# reasoning_collapsed = true → reasoning blocks (Thoughts / Reflection) start
#   folded to a one-line header; click the header to expand.
# toolview_collapsed = true  → tool call + result widgets start folded to a
#   one-line header (⚙ name / ✓ name); click to expand args and result.
# Both are DISPLAY settings - to stop reasoning tokens being sent to the API
# at all, use --remove-api-reasoning / /remove-api-reasoning.
# Change at runtime with: /reasoning hide|show|pin|unpin
#                         /toolview hide|show|pin|unpin
[ui]
cursor_blink = false
reasoning_collapsed = true
toolview_collapsed = true
# Status-bar colours. fg = text colour, bg = background; "" = leave that
# channel alone (fg falls back to the bar's text colour, bg to its own).
# Any name the terminal knows works: red, yellow, orange, black, #ff8800 ...
#
# The bar itself. DEFAULT: the theme's own colours (white on the primary
# colour). Uncomment to pin your own, e.g. a dark grey bar:
# status_fg = "white"
# status_bg = "#333333"
#
# The Ctx segment turns warn at 80% and crit at 90% of the [auto_context]
# threshold. DEFAULT: coloured text on the bar's own background.
ctx_warn_fg = "yellow"
ctx_warn_bg = ""
ctx_crit_fg = "red"
ctx_crit_bg = ""
# SOLID BLOCK alternative - black text on a coloured background, visually
# distinct from a foreground-only red (e.g. a bell indicator).
# To use it: comment out the four lines above, uncomment the four below.
# ctx_warn_fg = "black"
# ctx_warn_bg = "yellow"
# ctx_crit_fg = "black"
# ctx_crit_bg = "red"

# Vision support — lets the agent "see" images returned by tools.
# Uncomment and configure to enable.
#
# mode = "sidecar"  → a separate vision model describes images (works with any text model)
# mode = "native"   → images injected inline (main model must support vision)
# mode = "auto"     → checks model name against native_vision_patterns
#
# sidecar_provider references an existing [[providers]] entry by name.
# sidecar_model is optional — omit to use the server's default model.
#
# [vision]
# mode = "sidecar"
# sidecar_provider = "studio-oMLX"
# # sidecar_model = "gemma-4-31b"
# native_vision_patterns = ["gemma-3*", "gemma-4*", "qwen*-vl*", "llava*"]
# Agent13 Configuration
# Config directory: ~/.agent13 (or $AGENT13_CONFIG_DIR)
# Environment: ~/.env then ./.env (local overrides global)

# Providers. These are EXAMPLES: replace api_base with your own host - a
# hostname, an IP, or localhost. A provider is selected by name on the command
# line (`agent13 studio`); `--list-providers` shows what is configured.
[[providers]]
name = "studio"
api_base = "http://localhost:8012/v1"
api_key_env_var = "OPENAI_API_KEY"

[[providers]]
name = "studiomlx"
api_base = "http://localhost:8111/v1"
api_key_env_var = "OPENAI_API_KEY"

[[providers]]
name = "openrouter"
api_base = "https://openrouter.ai/api/v1"
api_key_env_var = "OPENROUTER_API_KEY"

# A model server on another machine on your network. "example-host" stands in
# for its hostname or IP.
[[providers]]
name = "lanmlx"
api_base = "http://example-host:8111/v1"
api_key_env_var = "OPENAI_API_KEY"
# read_timeout = 2400  # Seconds to wait for tokens during streaming (default: 2400)
# connect_timeout = 30  # Seconds to wait for initial connection (default: 30)

[[providers]]
name = "lanstudio"
api_base = "http://example-host:8012/v1"
api_key_env_var = "OPENAI_API_KEY"

[[providers]]
name = "lanserver"
api_base = "http://example-host:9292/v1"
api_key_env_var = "OPENAI_API_KEY"

# Global tool filtering (applies to ALL tools: builtin + MCP)
# If enabled_tools is non-empty, only matching tools are active (whitelist)
# Otherwise, disabled_tools acts as a blacklist
# Patterns: glob (tui_*) or regex (re:^tui.*)
# enabled_tools = []
# disabled_tools = ["tui_*"]

# Skills
# skill_paths = extra directories to search for skills (highest priority,
#   searched before the built-in default_skills). Example:
# skill_paths = ["~/my-skills"]
# include_skills = true  # inject skills into the system prompt (default false;
#   also settable with the --skills CLI flag)

# MCP Servers - HTTP transport (remote)
# [[mcp_servers]]
# name = "hvac_server"
# transport = "http"
# url = "http://localhost:4040/mcp"
# enabled_tools = []
# disabled_tools = []
# connect_timeout = 300  # Seconds to establish the connection (default: 300)
# tool_timeout = 60      # Seconds per tool call (default: 60)
# retry_attempts = 3     # Connection retry attempts (default: 3)
# retry_delay = 1.0      # Initial retry delay in seconds (default: 1.0)

# MCP Servers - stdio transport (local process)
# --with mcp<2: pin MCP SDK 1.x — many MCP servers import mcp.server.fastmcp
#   which was removed in MCP SDK 2.0. Remove once your servers support 2.x.
# --with playwright==1.61.0: pin the browser driver. web-research-assistant uses
#   Playwright for crawl_url; unpinned, uvx drifts to the latest release, whose
#   required Chromium build isn't in ~/Library/Caches/ms-playwright, so crawl_url
#   fails with "Executable doesn't exist". 1.61.0 -> build 1228. If you bump the
#   pin, run: uvx --with "playwright==<NEW>" playwright install chromium

# [[mcp_servers]]
# name = "web_research"
# transport = "stdio"
# command = "uvx"
# args = ["--with", "mcp<2", "--with", "playwright==1.61.0", "web-research-assistant"]
# env = { "SEARXNG_BASE_URL" = "http://searxng/search" }
# enabled_tools = []
# disabled_tools = []
# connect_timeout = 300  # Seconds to establish the connection (default: 300)
# tool_timeout = 60      # Seconds per tool call (default: 60)
# retry_attempts = 3     # Connection retry attempts (default: 3)
# retry_delay = 1.0      # Initial retry delay in seconds (default: 1.0)

[[mcp_servers]]
name = "fetch_server"
transport = "stdio"
command = "uvx"
args = ["--with", "mcp<2", "mcp-server-fetch", "--ignore-robots-txt"]
env = {}
enabled_tools = []
disabled_tools = []
