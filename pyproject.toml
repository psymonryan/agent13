[project]
name = "agent13"
version = "0.5.0"
description = "Context-lean AI agent - minimal VRAM fits in a small cupboard, a postbox or even a clock"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Simon Ryan, various local models" }
]
dependencies = [
    # Pinned exact: openai 3.x is in flux (httpx2 migration, retry-semantics
    # changes between minors - see the "Event loop is closed" TUI bug where
    # 3.14.1 stopped retrying raw RuntimeErrors). Bump deliberately with a
    # test run. httpx is pinned because create_client passes a legacy
    # httpx.Timeout into a client that internally uses httpx2.
    "openai==3.13.0",
    "httpx==0.28.1",
    "textual",
    "rich",
    "python-dotenv",
    "pyyaml",
    "pydantic",
    "pyte",
    "mcp",
    "filelock",
    "Pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "responses",
    "pexpect",
    "ruff>=0.15.12",
    "pip-audit",
    "pytest-httpserver>=1.1.5",
    "psutil",
    "pyreadline3; sys_platform == 'win32'",
    "pyinstaller>=6.22.2",
]

[project.scripts]
agent13 = "agent13.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent13", "ui", "tools"]
artifacts = [
    "agent13/default_skills/**",
    "agent13/default_config.toml",
    "agent13/default_env",
    "agent13/default_prompts.yaml",
    "agent13/sandbox_profiles/*.sb",
]

[tool.hatch.build.targets.sdist]
packages = ["agent13", "ui", "tools"]
artifacts = [
    "agent13/default_skills/**",
    "agent13/default_config.toml",
    "agent13/default_env",
    "agent13/default_prompts.yaml",
    "agent13/sandbox_profiles/*.sb",
]
