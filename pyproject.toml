[project]
name = "agent13"
version = "0.4.1"
description = "Context-lean AI agent - minimal VRAM fits in a small cupboard, a postbox or even a clock"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Simon Ryan, various local models" }
]
dependencies = [
    "openai",
    "textual",
    "rich",
    "python-dotenv",
    "pyyaml",
    "pydantic",
    "pyte",
    "mcp",
    "filelock",
    "httpx",
    "Pillow",
    # tomllib is stdlib only on 3.11+; config.py/sandbox.py fall back to tomli
    # on 3.10 (see `import tomllib` / `except ImportError: import tomli`).
    "tomli; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "responses",
    "pexpect",
    "ruff>=0.15.12",
    "pip-audit",
    "pytest-httpserver>=1.1.5",
    "psutil",
    "pyreadline3; sys_platform == 'win32'",
    "pyinstaller>=6.22.2",
]

[project.scripts]
agent13 = "agent13.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent13", "ui", "tools"]
artifacts = [
    "agent13/default_skills/**",
    "agent13/default_config.toml",
    "agent13/default_env",
    "agent13/default_prompts.yaml",
    "agent13/sandbox_profiles/*.sb",
]

[tool.hatch.build.targets.sdist]
packages = ["agent13", "ui", "tools"]
artifacts = [
    "agent13/default_skills/**",
    "agent13/default_config.toml",
    "agent13/default_env",
    "agent13/default_prompts.yaml",
    "agent13/sandbox_profiles/*.sb",
]
